<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tomato Pasta with Vegetables | Comments</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="site-header">
      <h1 class="site-title">Tomato Pasta with Vegetables</h1>

      <nav class="nav" aria-label="Primary navigation">
        <a href="index.html" data-page="index">Home</a>
        <a href="ingredients.html" data-page="ingredients">Ingredients</a>
        <a href="steps.html" data-page="steps">Steps</a>
        <a href="healthy.html" data-page="healthy">Why Healthy</a>
        <a href="vitamins.html" data-page="vitamins">Vitamins</a>
        <a href="comments.html" data-page="comments">Comments</a>
      </nav>
    </header>

    <main class="card">
      <h2 class="section-title">Comments</h2>
      <p class="text">
        Add a comment below. Comments are saved in <strong>localStorage</strong> in your browser.
      </p>

      <div class="form-row">
        <input
          class="input"
          id="commentInput"
          type="text"
          placeholder="Write a comment (e.g., 'Loved it with extra zucchini!')"
          aria-label="Comment input"
        />
        <button class="btn" id="addCommentBtn" type="button">Add comment</button>
      </div>

      <ul id="commentsList" class="comments-list" aria-label="Saved comments">
        <!-- JavaScript will render comments here -->
      </ul>

      <div class="note">
        <p class="note-title">Privacy note</p>
        <p class="note-text">
          localStorage saves data on your device in this browser only (not on a server).
        </p>
      </div>
    </main>

    <footer class="footer">
      <p class="footer-text">© <span id="year"></span> Tomato Pasta Website</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
